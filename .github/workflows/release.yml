---
name: Build and Release

"on":
  pull_request:
  push:
    branches:
      - master
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  TERMINAL_DIR: terminal
  ZIRAN: ${{ github.workspace }}/ziran/build/bin/ziran
  TERMINAL_BUILD_JOBS: 1
  LP_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  linux-build:
    name: Linux build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Terminal
        uses: actions/checkout@v4
        with:
          path: ${{ env.TERMINAL_DIR }}

      - name: Read locked toolchain
        id: toolchain
        working-directory: ${{ env.TERMINAL_DIR }}
        run: |
          python3 - <<'PY'
          import json
          import os
          with open("ziran.lock") as source:
              toolchain = json.load(source)["toolchain"]
          assert toolchain["url"] == "https://github.com/ziranlang/ziran.git"
          commit = toolchain["commit"]
          assert len(commit) == 40 and all(c in "0123456789abcdef" for c in commit)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\n")
          PY

      - name: Check out locked Ziran
        uses: actions/checkout@v4
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.toolchain.outputs.commit }}
          path: ziran

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            curl \
            dbus \
            desktop-file-utils \
            dpkg-dev \
            exo-utils \
            file \
            fonts-dejavu-core \
            imagemagick \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwebp-dev \
            libsdl2-dev \
            libx11-dev \
            libxcb1-dev \
            pkg-config \
            ripgrep \
            tesseract-ocr \
            thunar \
            xauth \
            xdotool \
            x11-apps \
            x11-xserver-utils \
            xclip \
            xvfb

      - name: Build locked Ziran tools
        working-directory: ziran
        run: env -u DISPLAY -u WAYLAND_DISPLAY make -j2 JOBS=2 all

      - name: Build and test Terminal from locked packages
        working-directory: ${{ env.TERMINAL_DIR }}
        run: |
          test ! -e ziran.local.toml
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY \
            -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER make -j1 all test

      - name: Package Linux release assets
        working-directory: ${{ env.TERMINAL_DIR }}
        run: |
          set -eu
          umask 022
          version="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          version="$(printf '%s' "${version}" | tr '/ :' '---')"
          deb_version="$(printf '%s' "${version}" | sed 's/^v//; s/[^A-Za-z0-9.+:~_-]/-/g')"
          case "${deb_version}" in
            [0-9]*) ;;
            *) deb_version="0.0.0+${deb_version}" ;;
          esac
          # Version-free names keep /releases/latest/download/<name> stable.
          deb_root="dist/deb/terminal"
          mkdir -p "${deb_root}/DEBIAN" \
            "${deb_root}/usr/bin" \
            "${deb_root}/usr/share/applications" \
            "${deb_root}/usr/share/doc/terminal" \
            "${deb_root}/usr/share/icons/hicolor/scalable/apps"
          chmod 755 "${deb_root}/DEBIAN"
          cp build/linux-x86_64/bin/terminal "${deb_root}/usr/bin/terminal"
          cp README.md "${deb_root}/usr/share/doc/terminal/README.md"
          cp docs/site/favicon.svg \
            "${deb_root}/usr/share/icons/hicolor/scalable/apps/terminal.svg"
          cat > "${deb_root}/usr/share/applications/terminal.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Terminal
          Comment=Kryon terminal emulator
          Exec=terminal
          Icon=terminal
          Terminal=false
          Categories=System;TerminalEmulator;
          Keywords=shell;prompt;command;terminal;
          EOF
          # Depends comes from the binary's real libraries, GTK included.
          mkdir -p dist/shlibdeps/debian
          printf 'Source: terminal\n\nPackage: terminal\nArchitecture: any\n' \
            > dist/shlibdeps/debian/control
          depends="$(cd dist/shlibdeps && dpkg-shlibdeps -O \
            "${GITHUB_WORKSPACE}/${TERMINAL_DIR}/${deb_root}/usr/bin/terminal" |
            sed -n 's/^shlibs:Depends=//p')"
          test -n "${depends}"
          cat > "${deb_root}/DEBIAN/control" <<EOF
          Package: terminal
          Version: ${deb_version}
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Waozi <waozi@proton.me>
          Depends: ${depends}
          Recommends: fonts-dejavu-core
          Description: Kryon terminal emulator
           Terminal is a standalone terminal application using Kryon for windowing,
           rendering, input, and platform integration.
          EOF
          chmod 644 "${deb_root}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${deb_root}" \
            "dist/terminal-linux-amd64.deb"

          appdir="dist/AppDir"
          mkdir -p "${appdir}/usr/bin" \
            "${appdir}/usr/share/applications" \
            "${appdir}/usr/share/icons/hicolor/scalable/apps"
          cp build/linux-x86_64/bin/terminal "${appdir}/usr/bin/terminal"
          cp docs/site/favicon.svg \
            "${appdir}/usr/share/icons/hicolor/scalable/apps/terminal.svg"
          cp "${deb_root}/usr/share/applications/terminal.desktop" \
            "${appdir}/usr/share/applications/terminal.desktop"
          # linuxdeploy bundles SDL2, WebP and their dependencies. GTK, GLib,
          # Cairo, Pango and GL come from the host: a bundled GTK would not
          # match the desktop's themes and modules.
          linuxdeploy="${RUNNER_TEMP}/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o "${linuxdeploy}" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  ${linuxdeploy}" |
            sha256sum -c -
          chmod 755 "${linuxdeploy}"
          root="${GITHUB_WORKSPACE}/${TERMINAL_DIR}"
          (
            cd dist
            APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
              LINUXDEPLOY_OUTPUT_VERSION="${deb_version}" \
              LDAI_OUTPUT=terminal-linux-x86_64.AppImage \
              "${linuxdeploy}" --appdir "${root}/${appdir}" \
              --executable "${root}/${appdir}/usr/bin/terminal" \
              --desktop-file "${root}/${appdir}/usr/share/applications/terminal.desktop" \
              --icon-file "${root}/${appdir}/usr/share/icons/hicolor/scalable/apps/terminal.svg" \
              --exclude-library 'libgtk-3.so*' --exclude-library 'libgdk-3.so*' \
              --exclude-library 'libgdk_pixbuf-2.0.so*' --exclude-library 'libglib-2.0.so*' \
              --exclude-library 'libgobject-2.0.so*' --exclude-library 'libgio-2.0.so*' \
              --exclude-library 'libgmodule-2.0.so*' --exclude-library 'libcairo*' \
              --exclude-library 'libpango*' --exclude-library 'libatk*' \
              --exclude-library 'libGL.so*' --exclude-library 'libGLX*' \
              --output appimage
          )
          test -x dist/terminal-linux-x86_64.AppImage

          sha256sum dist/terminal-linux-amd64.deb \
            dist/terminal-linux-x86_64.AppImage > dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-linux-x86_64
          path: |
            ${{ env.TERMINAL_DIR }}/dist/*.deb
            ${{ env.TERMINAL_DIR }}/dist/*.AppImage
            ${{ env.TERMINAL_DIR }}/dist/SHA256SUMS

      - name: Upload release assets
        if: github.event_name == 'release'
        working-directory: ${{ env.TERMINAL_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "${RELEASE_TAG}"
          dist/terminal-linux-amd64.deb dist/terminal-linux-x86_64.AppImage
          dist/SHA256SUMS --clobber
